[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "Robo-annotate"
version = "0.1.0"
description = "The open annotation engine for embodied AI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av>=15,<17",
  "fastapi>=0.116,<0.117",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "numpy>=2.2,<3",
  "openai>=2,<3",
  "pillow>=11,<13",
  "pyarrow>=22,<23",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/jokeru8/Robo-annotate"
Repository = "https://github.com/jokeru8/Robo-annotate"
Issues = "https://github.com/jokeru8/Robo-annotate/issues"

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1,<2"]

[project.scripts]
Robo-annotate = "robo_annotate.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/robo_annotate"]
