[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwen-lerobot-annotate"
version = "0.1.0"
description = "Annotate LeRobot datasets with Qwen3.8"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av>=15,<17",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "numpy>=2.2,<3",
  "openai>=2,<3",
  "pillow>=11,<13",
  "pyarrow>=22,<23",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1,<2"]

[project.scripts]
qwen-annotate = "qwen_annotate.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_annotate"]

